<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9dce2">
<title>刘小昱的海岛</title>
<script>
const requestedIslandView=new URLSearchParams(location.search).get('view');
let islandView='landscape';
function setIslandView(view){
  islandView=view==='portrait'?'portrait':'landscape';
  document.documentElement.classList.toggle('view-portrait',islandView==='portrait');
  document.documentElement.classList.toggle('view-landscape',islandView==='landscape');
  document.title='刘小昱的海岛 · '+(islandView==='portrait'?'竖屏版':'横屏版');
  const portraitLink=document.getElementById('portrait-view');
  const landscapeLink=document.getElementById('landscape-view');
  if(portraitLink)portraitLink.toggleAttribute('aria-current',islandView==='portrait');
  if(landscapeLink)landscapeLink.toggleAttribute('aria-current',islandView==='landscape');
}
const orientationMedia=window.matchMedia('(orientation:portrait)');
setIslandView(requestedIslandView==='portrait'||requestedIslandView==='landscape'?requestedIslandView:(orientationMedia.matches?'portrait':'landscape'));
if(requestedIslandView!=='portrait'&&requestedIslandView!=='landscape'){
  const followOrientation=event=>setIslandView(event.matches?'portrait':'landscape');
  if(orientationMedia.addEventListener)orientationMedia.addEventListener('change',followOrientation);else orientationMedia.addListener(followOrientation);
}
</script>
<style>
@font-face{font-family:"Smiley Sans";src:url("assets/fonts/SmileySans-Oblique.woff2") format("woff2");font-display:swap}
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#24505e;background:#b9dce2}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden}
.page{position:relative;display:grid;grid-template-rows:auto auto;justify-items:center;align-content:center;gap:12px;width:100%;height:100vh;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(circle at 8% 7%,#fff4d7 0,transparent 38%),radial-gradient(circle at 96% 89%,#fbe7ea 0,transparent 35%),#b9dce2}
.page::before,.page::after{position:absolute;pointer-events:none;color:#fff7e5;opacity:.78;font:44px/1 Georgia,serif;content:"✦"}.page::before{left:4%;top:24%;transform:rotate(-16deg)}.page::after{right:4%;bottom:21%;color:#f7cfbb;transform:rotate(15deg)}
.heading{z-index:2;min-height:58px;text-align:center}.eyebrow{display:block;margin-bottom:2px;color:#5b8c95;font-size:10px;letter-spacing:.25em}.heading h1{margin:0;color:#276477;font:400 clamp(27px,3.7vw,42px)/1.16 "Smiley Sans","Microsoft YaHei",sans-serif;letter-spacing:.04em;white-space:nowrap}
.scene{position:relative;z-index:1;width:min(calc(100vw - 32px),calc((100dvh - 126px)*16/9));aspect-ratio:16/9;max-height:calc(100dvh - 126px);overflow:hidden;border:4px solid #fff9e9;border-radius:20px;background:#88bed0;box-shadow:0 0 0 8px #fff9e966,0 18px 45px #356a793d;isolation:isolate;touch-action:manipulation;cursor:default;outline:none;-webkit-tap-highlight-color:transparent}
.scene::after{content:"";position:absolute;z-index:4;inset:6px;border:1px dashed #fff8e9b0;border-radius:11px;pointer-events:none}
.video-layer{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;pointer-events:none;opacity:0;image-rendering:auto}
.video-layer.is-current{z-index:2;opacity:1}
.controls{position:absolute;z-index:5;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;pointer-events:none}
.control-button,.sound-button{min-height:36px;padding:7px 13px;border:1px solid #fff9e9;border-radius:999px;color:#276477;background:#fff9e9e8;box-shadow:0 3px 10px #356a7926;font:inherit;font-size:12px;letter-spacing:.02em;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.control-button:hover,.sound-button:hover{background:#fff}.control-button:focus-visible,.sound-button:focus-visible{outline:2px solid #276477;outline-offset:2px}.control-button[aria-pressed=true]{background:#276477;color:#fff9e9}
.sound-button{position:absolute;z-index:5;top:12px;right:12px;min-height:32px;padding:6px 11px;font-size:11px}.sound-button[aria-pressed=true]{background:#276477;color:#fff9e9}
.loading{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:80%;margin:0;padding:12px 18px;border:1px solid #fff8e9;border-radius:14px;color:#265c6b;background:#fff9e9ef;text-align:center;font-size:13px;line-height:1.6}.loading[hidden]{display:none}
.view-switcher{position:absolute;z-index:7;top:12px;left:12px;display:flex;padding:3px;border:1px solid #fff9e9c7;border-radius:999px;background:#ffffffdc;box-shadow:0 3px 10px #356a7921}.view-switcher a{display:block;padding:5px 9px;border-radius:999px;color:#276477;text-decoration:none;font-size:10px;line-height:1.1;letter-spacing:.04em;white-space:nowrap}.view-switcher a[aria-current=page]{color:#fff9e9;background:#276477}.view-switcher a:focus-visible{outline:2px solid #276477;outline-offset:2px}
html.view-portrait .page{grid-template-rows:auto auto;gap:10px;padding:max(14px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom));align-content:center}
html.view-portrait .heading{min-height:55px}html.view-portrait .heading h1{font-size:clamp(25px,7vw,38px)}
html.view-portrait .scene{width:auto;height:min(calc(100dvh - 104px),calc((100vw - 20px)*16/9));max-width:calc(100vw - 20px);max-height:none;aspect-ratio:9/16;border-width:3px;border-radius:20px;box-shadow:0 0 0 5px #fff9e977,0 14px 35px #356a7938}
html.view-portrait .video-layer{object-position:50% 50%;transform:scale(1.14);transform-origin:center}html.view-portrait .scene.has-friend .video-layer{object-position:57% 50%}html.view-portrait .scene::after{inset:5px;border-radius:12px}html.view-portrait .controls{bottom:10px;padding:0 10px}html.view-portrait .sound-button{top:10px;right:10px}html.view-portrait .view-switcher{top:10px;left:10px}
@media(max-width:620px){.page{gap:10px}.heading{min-height:50px}.scene{width:calc(100vw - 20px);max-height:none;border-width:3px;border-radius:12px;box-shadow:0 0 0 4px #fff9e977,0 9px 25px #356a7933}.scene::after{inset:4px;border-radius:6px}.controls{bottom:9px;padding:0 8px}.control-button{min-height:34px;padding:6px 10px;font-size:11px}.sound-button{top:8px;right:8px;min-height:30px;padding:5px 9px;font-size:10px}.page::before{top:19%;left:7%;font-size:28px}.page::after{bottom:19%;right:7%;font-size:29px}html.view-portrait .scene{width:auto;height:min(calc(100dvh - 100px),calc((100vw - 20px)*16/9));border-radius:18px}html.view-portrait .view-switcher{top:8px;left:8px}html.view-portrait .view-switcher a{padding:5px 8px}}
@media (orientation:landscape) and (max-width:1000px) and (max-height:650px){html:not(.view-portrait),html:not(.view-portrait) body{background:#000}html:not(.view-portrait) .page{display:block;padding:0;background:#000}html:not(.view-portrait) .heading,html:not(.view-portrait) .page::before,html:not(.view-portrait) .page::after{display:none}html:not(.view-portrait) .scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}html:not(.view-portrait) .scene::after{display:none}html:not(.view-portrait) .controls{bottom:max(12px,env(safe-area-inset-bottom));padding-right:max(12px,env(safe-area-inset-right));padding-left:max(12px,env(safe-area-inset-left))}html:not(.view-portrait) .sound-button{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}html:not(.view-portrait) .view-switcher{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}}
</style>
</head>
<body>
<main class="page">
<header class="heading"><span class="eyebrow">SUMMER ISLAND</span><h1>刘小昱的海岛</h1></header>
<section class="scene" id="scene" role="button" tabindex="0" aria-label="点击画面切换动作" aria-busy="true">
<nav class="view-switcher" aria-label="画面版本切换"><a id="landscape-view" href="?view=landscape">横屏版</a><a id="portrait-view" href="?view=portrait">竖屏版</a></nav>
<video id="island-video" class="video-layer is-current" poster="assets/rendered/poster.jpg" autoplay muted loop playsinline preload="auto" width="1920" height="1080" aria-label="完整渲染的海岛动画"></video>
<video id="incoming-video" class="video-layer" muted loop playsinline preload="metadata" width="1920" height="1080" aria-hidden="true"></video>
<p class="loading" id="loading" role="status">小岛正在准备中…</p>
<div class="controls" aria-label="动画控制"><button class="control-button action-switch" id="action-switch" type="button" aria-label="切换动作">点击画面</button><button class="control-button invite" id="invite-friend" type="button" aria-pressed="false">邀请他上岛</button></div>
<button class="sound-button" id="sound-toggle" type="button" aria-pressed="false" aria-label="开启环境音">开启声音</button>
<noscript><p class="loading">请开启 JavaScript 观看动画。</p></noscript>
</section>
</main>
<script>
const actions=['yobro','walk','bow','basketball','thoughtful','like','defiant','wild','scared','angry','box','spell','dance2','dance3','flee','angry3'];
const scene=document.getElementById('scene');
const actionSwitch=document.getElementById('action-switch');
const invite=document.getElementById('invite-friend');
const loading=document.getElementById('loading');
const soundToggle=document.getElementById('sound-toggle');
let activeVideo=document.getElementById('island-video');
let standbyVideo=document.getElementById('incoming-video');
setIslandView(islandView);
let actionIndex=1,withFriend=false,requestId=0,isChanging=false,hasLoaded=false,loadingTimer=0,loadTimer=0,messageTimer=0;
let warmTimer=0,warmedSource='';
let audioContext,masterGain,audioStarted=false,audioMuted=false,chimeTimer=0,melodyStep=0;
const qualitySetting=new URLSearchParams(location.search).get('quality');
const isWeChat=/MicroMessenger/i.test(navigator.userAgent);
const isMobileDevice=window.matchMedia('(max-width:1000px) and (pointer:coarse)').matches;
const useLiteVideo=qualitySetting==='lite'||(qualitySetting!=='high'&&(isWeChat||isMobileDevice));
const videoFolder=useLiteVideo?'assets/rendered':'assets/rendered1080';
function sourceFor(index=actionIndex,friend=withFriend){return videoFolder+'/'+actions[index]+'-'+(friend?'duo':'solo')+'.mp4'}
function warmNextAction(){
  clearTimeout(warmTimer);
  if(!useLiteVideo||!window.fetch||document.hidden)return;
  const nextSource=sourceFor((actionIndex+1)%actions.length,withFriend);
  if(nextSource===warmedSource)return;
  warmTimer=setTimeout(()=>{
    warmedSource=nextSource;
    fetch(nextSource,{cache:'force-cache',credentials:'same-origin'}).then(response=>{
      if(!response.ok)throw new Error('preload failed');
      return response.arrayBuffer();
    }).catch(()=>{if(warmedSource===nextSource)warmedSource=''});
  },450);
}
function delayLoading(){
  clearTimeout(loadingTimer);
  loading.hidden=true;
  loadingTimer=setTimeout(()=>{if(isChanging){loading.textContent='小岛正在准备中…';loading.hidden=false}},280);
}
function stopLoading(){
  clearTimeout(loadingTimer);
  loading.hidden=true;
  scene.setAttribute('aria-busy','false');
}
function clearVideoEvents(target){
  target.onloadedmetadata=null;
  target.onloadeddata=null;
  target.oncanplay=null;
  target.onplaying=null;
  target.onerror=null;
}
function prepareVideo(target){
  target.muted=true;
  target.loop=true;
  target.playsInline=true;
  target.setAttribute('muted','');
  target.setAttribute('playsinline','');
  target.setAttribute('webkit-playsinline','');
}
function releaseVideo(target){
  clearVideoEvents(target);
  target.pause();
  target.classList.remove('is-current');
  target.setAttribute('aria-hidden','true');
  target.removeAttribute('src');
  target.load();
}
function updateInvite(){
  invite.setAttribute('aria-pressed',String(withFriend));
  invite.textContent=withFriend?'让他回去':'邀请他上岛';
  scene.classList.toggle('has-friend',withFriend);
}
function showTemporaryMessage(text){
  clearTimeout(messageTimer);
  loading.textContent=text;
  loading.hidden=false;
  messageTimer=setTimeout(()=>{if(!isChanging)loading.hidden=true},1500);
}
function handleLoadFailure(target,id){
  if(id!==requestId)return;
  clearTimeout(loadTimer);
  clearTimeout(loadingTimer);
  if(target!==activeVideo)releaseVideo(target);
  else clearVideoEvents(target);
  isChanging=false;
  scene.setAttribute('aria-busy','false');
  showTemporaryMessage('网络较慢，请再点一次。');
}
function finishInitialLoad(target,id,nextIndex,nextWithFriend,nextSource){
  if(id!==requestId)return;
  clearTimeout(loadTimer);
  clearVideoEvents(target);
  actionIndex=nextIndex;
  withFriend=nextWithFriend;
  updateInvite();
  activeVideo=target;
  activeVideo.classList.add('is-current');
  activeVideo.removeAttribute('aria-hidden');
  activeVideo.setAttribute('aria-label','完整渲染的海岛动画');
  hasLoaded=true;
  isChanging=false;
  stopLoading();
  warmNextAction();
}
function finishSwap(target,id,nextIndex,nextWithFriend,nextSource){
  if(id!==requestId)return;
  clearTimeout(loadTimer);
  clearVideoEvents(target);
  const previous=activeVideo;
  actionIndex=nextIndex;
  withFriend=nextWithFriend;
  updateInvite();
  activeVideo=target;
  standbyVideo=previous;
  activeVideo.classList.add('is-current');
  activeVideo.removeAttribute('aria-hidden');
  activeVideo.setAttribute('aria-label','完整渲染的海岛动画');
  previous.classList.remove('is-current');
  previous.setAttribute('aria-hidden','true');
  previous.removeAttribute('aria-label');
  releaseVideo(previous);
  isChanging=false;
  stopLoading();
  warmNextAction();
}
function loadAction(nextIndex,nextWithFriend,keepTime=false){
  if(isChanging)return;
  const id=++requestId;
  const previousTime=keepTime&&Number.isFinite(activeVideo.currentTime)?activeVideo.currentTime:0;
  const nextSource=sourceFor(nextIndex,nextWithFriend);
  const target=hasLoaded?standbyVideo:activeVideo;
  isChanging=true;
  delayLoading();
  scene.setAttribute('aria-busy','true');
  clearVideoEvents(target);
  prepareVideo(target);
  target.onloadedmetadata=()=>{
    if(id!==requestId||!keepTime||!target.duration)return;
    try{target.currentTime=previousTime%target.duration}catch(error){}
  };
  const tryPlay=()=>{
    if(id!==requestId)return;
    const playPromise=target.play();
    if(playPromise&&typeof playPromise.catch==='function')playPromise.catch(()=>{});
  };
  target.onloadeddata=tryPlay;
  target.oncanplay=tryPlay;
  target.onplaying=()=>{
    if(id!==requestId)return;
    if(hasLoaded)finishSwap(target,id,nextIndex,nextWithFriend,nextSource);
    else finishInitialLoad(target,id,nextIndex,nextWithFriend,nextSource);
  };
  target.onerror=()=>handleLoadFailure(target,id);
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>handleLoadFailure(target,id),8000);
  target.src=nextSource;
  target.load();
}
function nextAction(){
  if(isChanging)return;
  loadAction((actionIndex+1)%actions.length,withFriend);
}
function createNoiseBuffer(context){
  const buffer=context.createBuffer(1,context.sampleRate*2.5,context.sampleRate);
  const data=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<data.length;i+=1){
    last=(last+.02*(Math.random()*2-1))/1.02;
    data[i]=last*3.3;
  }
  return buffer;
}
function addNoiseLayer(context,buffer,type,frequency,amount){
  const sourceNode=context.createBufferSource();
  const filter=context.createBiquadFilter();
  const gain=context.createGain();
  sourceNode.buffer=buffer;
  sourceNode.loop=true;
  filter.type=type;
  filter.frequency.value=frequency;
  gain.gain.value=amount;
  sourceNode.connect(filter).connect(gain).connect(masterGain);
  sourceNode.start(0,Math.random()*buffer.duration);
  return gain;
}
function buildAmbience(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return false;
  audioContext=new AudioContextClass();
  masterGain=audioContext.createGain();
  masterGain.gain.value=.0001;
  masterGain.connect(audioContext.destination);
  const noise=createNoiseBuffer(audioContext);
  const surf=addNoiseLayer(audioContext,noise,'lowpass',900,.13);
  const wind=addNoiseLayer(audioContext,noise,'bandpass',1650,.009);
  const swell=audioContext.createOscillator();
  const swellDepth=audioContext.createGain();
  swell.frequency.value=.075;
  swellDepth.gain.value=.045;
  swell.connect(swellDepth).connect(surf.gain);
  swell.start();
  const drift=audioContext.createOscillator();
  const driftDepth=audioContext.createGain();
  drift.frequency.value=.035;
  driftDepth.gain.value=.004;
  drift.connect(driftDepth).connect(wind.gain);
  drift.start();
  return true;
}
function playSoftNote(frequency,startAt){
  const oscillator=audioContext.createOscillator();
  const filter=audioContext.createBiquadFilter();
  const gain=audioContext.createGain();
  oscillator.type='sine';
  oscillator.frequency.value=frequency;
  filter.type='lowpass';
  filter.frequency.value=1800;
  gain.gain.setValueAtTime(.0001,startAt);
  gain.gain.exponentialRampToValueAtTime(.034,startAt+.12);
  gain.gain.exponentialRampToValueAtTime(.0001,startAt+1.9);
  oscillator.connect(filter).connect(gain).connect(masterGain);
  oscillator.start(startAt);
  oscillator.stop(startAt+2);
}
function scheduleChime(){
  clearTimeout(chimeTimer);
  if(!audioStarted||audioMuted||!audioContext)return;
  const melody=[523.25,659.25,783.99,659.25,587.33,493.88,587.33,659.25];
  const now=audioContext.currentTime+.08;
  for(let note=0;note<4;note+=1){
    playSoftNote(melody[(melodyStep+note)%melody.length],now+note*.44);
  }
  melodyStep=(melodyStep+4)%melody.length;
  chimeTimer=setTimeout(scheduleChime,5000);
}
function updateSoundButton(){
  const audible=audioStarted&&!audioMuted;
  soundToggle.setAttribute('aria-pressed',String(audible));
  soundToggle.textContent=audible?'静音':'开启声音';
  soundToggle.setAttribute('aria-label',audible?'关闭环境音':'开启环境音');
}
function startAmbience(){
  if(!audioContext&&!buildAmbience()){soundToggle.hidden=true;return}
  audioContext.resume().then(()=>{
    audioStarted=true;
    audioMuted=false;
    masterGain.gain.cancelScheduledValues(audioContext.currentTime);
    masterGain.gain.setTargetAtTime(.085,audioContext.currentTime,.7);
    scheduleChime();
    updateSoundButton();
  }).catch(()=>{});
}
function muteAmbience(){
  if(!audioContext)return;
  audioMuted=true;
  clearTimeout(chimeTimer);
  masterGain.gain.cancelScheduledValues(audioContext.currentTime);
  masterGain.gain.setTargetAtTime(.0001,audioContext.currentTime,.18);
  updateSoundButton();
}
function resumeVideos(){
  prepareVideo(activeVideo);
  activeVideo.play().catch(()=>{});
  if(isChanging&&standbyVideo.src&&standbyVideo.readyState>=2){
    prepareVideo(standbyVideo);
    standbyVideo.play().catch(()=>{});
  }
}
function beginAmbientOnFirstTouch(){
  resumeVideos();
  if(!audioStarted&&!audioMuted)startAmbience();
}
actionSwitch.addEventListener('click',()=>{beginAmbientOnFirstTouch();nextAction()});
scene.addEventListener('click',event=>{if(event.target.closest('button,a'))return;beginAmbientOnFirstTouch();nextAction()});
scene.addEventListener('keydown',event=>{if(event.target.closest('button'))return;if(event.key==='Enter'||event.key===' '){event.preventDefault();beginAmbientOnFirstTouch();nextAction()}});
invite.addEventListener('click',()=>{
  if(isChanging)return;
  beginAmbientOnFirstTouch();
  loadAction(actionIndex,!withFriend,true);
});
soundToggle.addEventListener('click',()=>{if(audioStarted&&!audioMuted)muteAmbience();else startAmbience()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    activeVideo.pause();
    standbyVideo.pause();
    if(audioContext&&audioContext.state==='running')audioContext.suspend().catch(()=>{});
  }else{
    resumeVideos();
    if(audioStarted&&!audioMuted&&audioContext)audioContext.resume().catch(()=>{});
  }
});
updateSoundButton();
loadAction(actionIndex,withFriend);
</script>
</body>
</html>
