<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9dce2">
<title>刘小昱的海岛</title>
<style>
@font-face{font-family:"Smiley Sans";src:url("assets/fonts/SmileySans-Oblique.woff2") format("woff2");font-display:swap}
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#24505e;background:#b9dce2}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden}
.page{position:relative;display:grid;grid-template-rows:auto auto;justify-items:center;align-content:center;gap:12px;width:100%;height:100vh;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(circle at 8% 7%,#fff4d7 0,transparent 38%),radial-gradient(circle at 96% 89%,#fbe7ea 0,transparent 35%),#b9dce2}
.page::before,.page::after{position:absolute;pointer-events:none;color:#fff7e5;opacity:.78;font:44px/1 Georgia,serif;content:"✦"}.page::before{left:4%;top:24%;transform:rotate(-16deg)}.page::after{right:4%;bottom:21%;color:#f7cfbb;transform:rotate(15deg)}
.heading{z-index:2;min-height:58px;text-align:center}.eyebrow{display:block;margin-bottom:2px;color:#5b8c95;font-size:10px;letter-spacing:.25em}.heading h1{margin:0;color:#276477;font:400 clamp(27px,3.7vw,42px)/1.16 "Smiley Sans","Microsoft YaHei",sans-serif;letter-spacing:.04em;white-space:nowrap}
.scene{position:relative;z-index:1;width:min(calc(100vw - 32px),calc((100dvh - 126px)*16/9));aspect-ratio:16/9;max-height:calc(100dvh - 126px);overflow:hidden;border:4px solid #fff9e9;border-radius:20px;background:#88bed0;box-shadow:0 0 0 8px #fff9e966,0 18px 45px #356a793d;isolation:isolate;touch-action:manipulation;cursor:default;outline:none;-webkit-tap-highlight-color:transparent}
.scene::before{position:absolute;z-index:3;inset:0;content:"";pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 26%,#fff9e97a 47%,transparent 66%);transform:translateX(-42%);transition:opacity .14s ease}
.scene::after{content:"";position:absolute;z-index:4;inset:6px;border:1px dashed #fff8e9b0;border-radius:11px;pointer-events:none}
.scene.is-transitioning::before{opacity:1;animation:card-glint .52s ease-out both}
@keyframes card-glint{from{transform:translateX(-54%)}to{transform:translateX(54%)}}
.video-layer{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;pointer-events:none;opacity:0;transform:scale(1.01);transition:none}
.video-layer.is-current{opacity:1;transform:translate3d(0,0,0) scale(1)}
.video-layer.is-entering{z-index:2;opacity:0;transform:translate3d(13%,1%,0) rotate(1.8deg) scale(.965);transition:transform .48s cubic-bezier(.18,.82,.25,1),opacity .32s ease-out}
.scene.is-transitioning .video-layer.is-entering{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1)}
.video-layer.is-leaving{z-index:1;transition:transform .48s cubic-bezier(.18,.82,.25,1),opacity .34s ease-out}
.scene.is-transitioning .video-layer.is-leaving{opacity:.28;transform:translate3d(-5%,0,0) rotate(-.8deg) scale(.985)}
.controls{position:absolute;z-index:5;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;pointer-events:none}
.control-button,.sound-button{min-height:36px;padding:7px 13px;border:1px solid #fff9e9;border-radius:999px;color:#276477;background:#fff9e9e8;box-shadow:0 3px 10px #356a7926;font:inherit;font-size:12px;letter-spacing:.02em;cursor:pointer;pointer-events:auto;touch-action:manipulation}
.control-button:hover,.sound-button:hover{background:#fff}.control-button:focus-visible,.sound-button:focus-visible{outline:2px solid #276477;outline-offset:2px}.control-button[aria-pressed=true]{background:#276477;color:#fff9e9}
.sound-button{position:absolute;z-index:5;top:12px;right:12px;min-height:32px;padding:6px 11px;font-size:11px}.sound-button[aria-pressed=true]{background:#276477;color:#fff9e9}
.loading{position:absolute;z-index:6;top:50%;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:80%;margin:0;padding:12px 18px;border:1px solid #fff8e9;border-radius:14px;color:#265c6b;background:#fff9e9ef;text-align:center;font-size:13px;line-height:1.6}.loading[hidden]{display:none}
@media(max-width:620px){.page{gap:10px}.heading{min-height:50px}.scene{width:calc(100vw - 20px);max-height:none;border-width:3px;border-radius:12px;box-shadow:0 0 0 4px #fff9e977,0 9px 25px #356a7933}.scene::after{inset:4px;border-radius:6px}.controls{bottom:9px;padding:0 8px}.control-button{min-height:34px;padding:6px 10px;font-size:11px}.sound-button{top:8px;right:8px;min-height:30px;padding:5px 9px;font-size:10px}.page::before{top:19%;left:7%;font-size:28px}.page::after{bottom:19%;right:7%;font-size:29px}}
@media (orientation:landscape) and (max-width:1000px) and (max-height:650px){html,body{background:#000}.page{display:block;padding:0;background:#000}.heading,.page::before,.page::after{display:none}.scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-height:none;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}.scene::after{display:none}.controls{bottom:max(12px,env(safe-area-inset-bottom));padding-right:max(12px,env(safe-area-inset-right));padding-left:max(12px,env(safe-area-inset-left))}.sound-button{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}}
@media (orientation:portrait) and (max-width:620px){.scene{width:calc(100vw - 20px);max-height:none}.controls{bottom:9px;padding:0 8px}.control-button{min-height:34px;padding:6px 10px;font-size:11px}}
</style>
</head>
<body>
<main class="page">
<header class="heading"><span class="eyebrow">SUMMER ISLAND</span><h1>刘小昱的海岛</h1></header>
<section class="scene" id="scene" role="button" tabindex="0" aria-label="点击画面切换动作" aria-busy="true">
<video id="island-video" class="video-layer is-current" poster="assets/rendered1080/poster.jpg" autoplay muted loop playsinline preload="auto" width="1920" height="1080" aria-label="完整渲染的海岛动画"></video>
<video id="incoming-video" class="video-layer" muted loop playsinline preload="metadata" width="1920" height="1080" aria-hidden="true"></video>
<p class="loading" id="loading" role="status">小岛正在准备中…</p>
<div class="controls" aria-label="动画控制"><button class="control-button action-switch" id="action-switch" type="button" aria-label="切换动作">点击画面</button><button class="control-button invite" id="invite-friend" type="button" aria-pressed="false">邀请他上岛</button></div>
<button class="sound-button" id="sound-toggle" type="button" aria-pressed="false" aria-label="开启环境音">开启声音</button>
<noscript><p class="loading">请开启 JavaScript 观看动画。</p></noscript>
</section>
</main>
<script>
const actions=['yobro','walk','bow','basketball','thoughtful','like','defiant','wild','scared','angry','box','spell','dance2','dance3','flee','angry3'];
const scene=document.getElementById('scene');
const actionSwitch=document.getElementById('action-switch');
const invite=document.getElementById('invite-friend');
const loading=document.getElementById('loading');
const soundToggle=document.getElementById('sound-toggle');
let activeVideo=document.getElementById('island-video');
let standbyVideo=document.getElementById('incoming-video');
let actionIndex=1,withFriend=false,requestId=0,isChanging=false,hasLoaded=false,loadingTimer=0,transitionTimer=0;
let audioContext,masterGain,audioStarted=false,audioMuted=false,chimeTimer=0;
function source(){return 'assets/rendered1080/'+actions[actionIndex]+'-'+(withFriend?'duo':'solo')+'.mp4'}
function delayLoading(){
  clearTimeout(loadingTimer);
  loading.hidden=true;
  loadingTimer=setTimeout(()=>{if(isChanging){loading.textContent='小岛正在准备中…';loading.hidden=false}},280);
}
function stopLoading(){
  clearTimeout(loadingTimer);
  loading.hidden=true;
  scene.setAttribute('aria-busy','false');
}
function releaseVideo(element){
  element.pause();
  element.onloadedmetadata=null;
  element.oncanplay=null;
  element.onerror=null;
  element.removeAttribute('src');
  element.load();
}
function finishInitialLoad(target,id){
  if(id!==requestId)return;
  target.className='video-layer is-current';
  target.removeAttribute('aria-hidden');
  hasLoaded=true;
  isChanging=false;
  stopLoading();
}
function finishTransition(target,id){
  if(id!==requestId)return;
  const previous=activeVideo;
  activeVideo=target;
  standbyVideo=previous;
  activeVideo.className='video-layer is-current';
  activeVideo.removeAttribute('aria-hidden');
  standbyVideo.className='video-layer';
  standbyVideo.setAttribute('aria-hidden','true');
  scene.classList.remove('is-transitioning');
  releaseVideo(standbyVideo);
  isChanging=false;
  stopLoading();
}
function beginCardTransition(target,id){
  clearTimeout(loadingTimer);
  loading.hidden=true;
  target.className='video-layer is-entering';
  target.removeAttribute('aria-hidden');
  target.offsetWidth;
  activeVideo.classList.add('is-leaving');
  scene.classList.add('is-transitioning');
  clearTimeout(transitionTimer);
  transitionTimer=setTimeout(()=>finishTransition(target,id),520);
}
function playCurrent(keepTime=false){
  if(isChanging)return;
  const id=++requestId;
  const previousTime=keepTime&&Number.isFinite(activeVideo.currentTime)?activeVideo.currentTime:0;
  const target=hasLoaded?standbyVideo:activeVideo;
  isChanging=true;
  delayLoading();
  scene.setAttribute('aria-busy','true');
  target.muted=true;
  target.onloadedmetadata=()=>{
    if(id!==requestId||!keepTime||!target.duration)return;
    try{target.currentTime=previousTime%target.duration}catch(error){}
  };
  target.oncanplay=()=>{
    if(id!==requestId)return;
    target.onloadedmetadata=null;
    target.oncanplay=null;
    target.onerror=null;
    target.play().catch(()=>{});
    if(hasLoaded)beginCardTransition(target,id);else finishInitialLoad(target,id);
  };
  target.onerror=()=>{
    if(id!==requestId)return;
    isChanging=false;
    loading.textContent='这个动作还在制作中，请再试一次。';
    clearTimeout(loadingTimer);
    loading.hidden=false;
    scene.setAttribute('aria-busy','false');
    if(target!==activeVideo)releaseVideo(target);
  };
  target.src=source();
  target.load();
  target.play().catch(()=>{});
}
function nextAction(){
  if(isChanging)return;
  actionIndex=(actionIndex+1)%actions.length;
  playCurrent();
}
function createNoiseBuffer(context){
  const buffer=context.createBuffer(1,context.sampleRate*4,context.sampleRate);
  const data=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<data.length;i+=1){
    last=(last+.02*(Math.random()*2-1))/1.02;
    data[i]=last*3.3;
  }
  return buffer;
}
function addNoiseLayer(context,buffer,type,frequency,amount){
  const sourceNode=context.createBufferSource();
  const filter=context.createBiquadFilter();
  const gain=context.createGain();
  sourceNode.buffer=buffer;
  sourceNode.loop=true;
  filter.type=type;
  filter.frequency.value=frequency;
  gain.gain.value=amount;
  sourceNode.connect(filter).connect(gain).connect(masterGain);
  sourceNode.start(0,Math.random()*buffer.duration);
  return gain;
}
function buildAmbience(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return false;
  audioContext=new AudioContextClass();
  masterGain=audioContext.createGain();
  masterGain.gain.value=.0001;
  masterGain.connect(audioContext.destination);
  const noise=createNoiseBuffer(audioContext);
  const surf=addNoiseLayer(audioContext,noise,'lowpass',900,.16);
  const wind=addNoiseLayer(audioContext,noise,'bandpass',1650,.009);
  const swell=audioContext.createOscillator();
  const swellDepth=audioContext.createGain();
  swell.frequency.value=.075;
  swellDepth.gain.value=.045;
  swell.connect(swellDepth).connect(surf.gain);
  swell.start();
  const drift=audioContext.createOscillator();
  const driftDepth=audioContext.createGain();
  drift.frequency.value=.035;
  driftDepth.gain.value=.004;
  drift.connect(driftDepth).connect(wind.gain);
  drift.start();
  return true;
}
function scheduleChime(){
  clearTimeout(chimeTimer);
  if(!audioStarted||audioMuted||!audioContext)return;
  const now=audioContext.currentTime+.08;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  const tones=[392,440,523.25,587.33,659.25];
  oscillator.type='sine';
  oscillator.frequency.value=tones[Math.floor(Math.random()*tones.length)];
  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.012,now+.16);
  gain.gain.exponentialRampToValueAtTime(.0001,now+3.1);
  oscillator.connect(gain).connect(masterGain);
  oscillator.start(now);
  oscillator.stop(now+3.2);
  chimeTimer=setTimeout(scheduleChime,8500+Math.random()*6500);
}
function updateSoundButton(){
  const audible=audioStarted&&!audioMuted;
  soundToggle.setAttribute('aria-pressed',String(audible));
  soundToggle.textContent=audible?'静音':'开启声音';
  soundToggle.setAttribute('aria-label',audible?'关闭环境音':'开启环境音');
}
function startAmbience(){
  if(!audioContext&&!buildAmbience()){soundToggle.hidden=true;return}
  audioContext.resume().then(()=>{
    audioStarted=true;
    audioMuted=false;
    masterGain.gain.cancelScheduledValues(audioContext.currentTime);
    masterGain.gain.setTargetAtTime(.085,audioContext.currentTime,.7);
    scheduleChime();
    updateSoundButton();
  }).catch(()=>{});
}
function muteAmbience(){
  if(!audioContext)return;
  audioMuted=true;
  clearTimeout(chimeTimer);
  masterGain.gain.cancelScheduledValues(audioContext.currentTime);
  masterGain.gain.setTargetAtTime(.0001,audioContext.currentTime,.18);
  updateSoundButton();
}
function beginAmbientOnFirstTouch(){if(!audioStarted&&!audioMuted)startAmbience()}
actionSwitch.addEventListener('click',()=>{beginAmbientOnFirstTouch();nextAction()});
scene.addEventListener('click',event=>{if(event.target.closest('button'))return;beginAmbientOnFirstTouch();nextAction()});
scene.addEventListener('keydown',event=>{if(event.target.closest('button'))return;if(event.key==='Enter'||event.key===' '){event.preventDefault();beginAmbientOnFirstTouch();nextAction()}});
invite.addEventListener('click',()=>{
  if(isChanging)return;
  beginAmbientOnFirstTouch();
  withFriend=!withFriend;
  invite.setAttribute('aria-pressed',String(withFriend));
  invite.textContent=withFriend?'让他回去':'邀请他上岛';
  playCurrent(true);
});
soundToggle.addEventListener('click',()=>{if(audioStarted&&!audioMuted)muteAmbience();else startAmbience()});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    activeVideo.pause();
    if(audioContext&&audioContext.state==='running')audioContext.suspend().catch(()=>{});
  }else{
    activeVideo.play().catch(()=>{});
    if(audioStarted&&!audioMuted&&audioContext)audioContext.resume().catch(()=>{});
  }
});
updateSoundButton();
playCurrent();
</script>
</body>
</html>
